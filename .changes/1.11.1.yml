version: 1.11.1
pr_number: 187
bug_fixes:
- description: '`dbt compile` fails on a new schema because the `get_metafields` macro
    queries `stg_shopify__metafield` before it exists. The macro now queries metafield
    keys only during `dbt run` and `dbt build`, which fixes compile for all `*_metafields`
    models.'
- description: dbt v2 strict compile (`--static-analysis strict`) fails on DuckDB because
    `shopify__calendar` compares a timestamp to a date. `shopify__calendar.date_day` is now
    a date on every warehouse, and the `shopify_lookback` macro now returns a date. This fixes
    strict compile for `shopify__calendar`, the `*__daily_shop` models and the `*__customer_cohorts`
    and `*__customer_email_cohorts` models. Their output values don't change.
date: '2026-11-12'

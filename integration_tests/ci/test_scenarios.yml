#   snowflake: ">=1.3.0,<2.0.0"
#   bigquery: ">=1.3.0,<2.0.0"
#   postgres: ">=1.3.0,<2.0.0"
#   redshift: ">=1.3.0,<2.0.0"
#   databricks: ">=1.6.0,<2.0.0"

schema_variable_name: "shopify_schema"

include_databricks_sql: true
include_sqlserver: false
include_dbt_compile: false

test_scenarios:
  - name: "Default"
    vars: {}
    include_incremental: false

  - name: "features enabled"
    vars:
      shopify_timezone: "America/New_York"
      shopify_using_fulfillment_event: true
      shopify_gql_using_fulfillment_event: true
      shopify_using_all_metafields: true
      shopify__calendar_start_date: "2020-01-01"
      shopify_using_abandoned_checkout: false
      shopify_gql_using_abandoned_checkout: false
      shopify_using_metafield: false
      shopify_gql_using_metafield: false
      shopify_using_discount_code_app: true
      shopify_gql_using_discount_code_app: true
      shopify_using_product_variant_media: true
      shopify_gql_product_variant_media: true
      shopify_gql_using_collection_rule: true
      shopify_gql_using_customer_visit: false
      shopify_gql_using_return: true
    include_incremental: false

  - name: "MDLS"
    vars:
      fivetran_using_source_casing: true
    include_incremental: false
    include_dbt_seed: true
